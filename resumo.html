<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FinPanel — Resumo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --accent: #00E5A0;
    --income: #00C97A;
    --expense: #FF4D6A;
    --warn: #FFB830;
    --invest: #4D79FF;
    --bg: #0D0F14;
    --surface: #13161E;
    --elevated: #1A1E28;
    --border: rgba(255,255,255,.08);
    --text: #FFFFFF;
    --muted: #BCC1D8;
    --radius: 14px;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --display: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 40px;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 18px; height: 18px; }
  .logo-text { font-family: var(--display); font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; }
  .header-sub { font-size: .8rem; color: var(--muted); font-family: var(--mono); letter-spacing: .06em; }

  /* ── Controles ── */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .control-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
  .control-group label {
    font-size: .68rem;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  select, input[type="month"] {
    background: var(--elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: .88rem;
    padding: 9px 12px;
    border-radius: 8px;
    outline: none;
    width: 100%;
    appearance: none;
  }
  select:focus, input:focus { border-color: var(--accent); }

  /* ── Cards de resumo ── */
  .summary-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .summary-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .summary-card.green::before { background: var(--income); }
  .summary-card.red::before   { background: var(--expense); }
  .summary-card.blue::before  { background: var(--invest); }
  .summary-card.warn::before  { background: var(--warn); }
  .card-label { font-size: .68rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .card-value { font-family: var(--mono); font-size: 1.2rem; font-weight: 500; }
  .card-value.income  { color: var(--income); }
  .card-value.expense { color: var(--expense); }
  .card-value.invest  { color: var(--invest); }
  .card-value.saldo-pos { color: var(--income); }
  .card-value.saldo-neg { color: var(--expense); }

  /* ── Seção de pessoa ── */
  .pessoa-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .pessoa-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--elevated);
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-wrap: wrap;
  }
  .pessoa-nome {
    font-family: var(--display);
    font-size: 1rem;
    font-weight: 700;
  }
  .pessoa-saldo {
    font-family: var(--mono);
    font-size: .95rem;
    font-weight: 600;
  }
  .pessoa-saldo.pos { color: var(--income); }
  .pessoa-saldo.neg { color: var(--expense); }
  .pessoa-saldo.zero { color: var(--muted); }

  /* Linha de item */
  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
    flex-wrap: wrap;
  }
  .item-row:last-child { border-bottom: none; }
  .item-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .item-desc { font-size: .85rem; color: var(--text); }
  .item-meta { font-size: .72rem; color: var(--muted); font-family: var(--mono); }
  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .item-valor { font-family: var(--mono); font-size: .9rem; font-weight: 500; }
  .item-valor.entrada { color: var(--income); }
  .item-valor.saida   { color: var(--expense); }
  .badge-status {
    font-size: .64rem;
    font-family: var(--mono);
    padding: 2px 7px;
    border-radius: 99px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .badge-status.pago    { background: rgba(0,201,122,.12); color: var(--income); border: 1px solid rgba(0,201,122,.25); }
  .badge-status.pendente{ background: rgba(255,184,48,.1); color: var(--warn);   border: 1px solid rgba(255,184,48,.25); }

  /* Subtotal */
  .subtotal-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--elevated);
    font-size: .8rem;
    color: var(--muted);
    font-family: var(--mono);
    border-top: 1px solid var(--border);
  }
  .subtotal-row span:last-child { font-weight: 600; color: var(--text); }

  /* ── Botão compartilhar ── */
  .share-bar {
    position: sticky;
    bottom: 16px;
    margin-top: 24px;
    display: flex;
    gap: 10px;
  }
  .btn-share {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: var(--sans);
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter .2s, transform .15s;
  }
  .btn-share:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-share:active { transform: translateY(0); }
  .btn-wpp  { background: #25D366; color: #fff; }
  .btn-copy { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }

  /* ── Loading / Empty ── */
  .loading, .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: .88rem;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Período badge ── */
  .periodo-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 5px 12px;
    font-size: .75rem;
    font-family: var(--mono);
    color: var(--accent);
    margin-bottom: 16px;
  }

  /* ── Saldo destaque ── */
  .saldo-destaque {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    overflow: hidden;
  }
  .saldo-destaque::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }
  .saldo-destaque-label { font-size: .7rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .saldo-destaque-valor { font-family: var(--mono); font-size: 1.6rem; font-weight: 500; }
  .saldo-destaque-sub { font-size: .76rem; color: var(--muted); margin-top: 2px; }

  /* ── Seção título ── */
  .section-title {
    font-family: var(--mono);
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 18 18" fill="none" stroke="#05120D" stroke-width="2" stroke-linecap="round">
        <rect x="1" y="4" width="16" height="11" rx="2"/>
        <path d="M5 4V3a1 1 0 011-1h6a1 1 0 011 1v1"/>
        <path d="M9 9v2M7 9h4"/>
      </svg>
    </div>
    <div class="logo-text">FinPanel</div>
  </div>
  <div class="header-sub">Resumo Financeiro por Pessoa</div>
</div>

<!-- Controles -->
<div class="controls">
  <div class="control-group">
    <label>Período</label>
    <input type="month" id="periodoInput"/>

    <label>Pessoa</label>

<div id="content">

<!-- Botões de compartilhamento -->
<div class="share-bar">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
/* ════════════════════════════════════════════
   INIT FIREBASE + CACHE LOCAL
════════════════════════════════════════════ */
let _db = null;
const cache = {};

async function initFirebase() {
  firebase.initializeApp(firebaseConfig);
  _db = firebase.firestore();
  _db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
}

async function loadUserData(userId) {
  if (!_db) return;
  const uid = String(userId);
  const snap = await _db.collection('usuarios').doc(uid).collection('dados').get();
  snap.forEach(doc => {
    try { cache[doc.id] = JSON.parse(doc.data().data); } catch {}
  });
}

async function loadGlobal() {
  if (!_db) return;
  const snap = await _db.collection('global').doc('dados').collection('chaves').get();
  snap.forEach(doc => {
    try { cache[doc.id] = JSON.parse(doc.data().data); } catch {}
  });
}

/* ════════════════════════════════════════════
   FORMATAÇÃO
════════════════════════════════════════════ */
const Fmt = {
  brl(v) { return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); },
  ref(r) {
    if (!r) return '—';
    const [y, m] = r.split('-');
    return ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][+m-1] + '/' + y;
  },
  addMonths(ym, n) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  },
  nowYM() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
  }
};

/* ════════════════════════════════════════════
   EXPANSÃO DE DADOS (igual ao script principal)
════════════════════════════════════════════ */
function expandirSaidas(saidas, ref) {
  const rows = [];
  saidas.forEach(s => {
    if (s.forma === 'avista') {
      if (s.ref === ref) rows.push({...s, parcelaNum:null, parcelaRef:s.ref, parcelaTotal:1, valorExib:s.valor, _parcelaIdx:'av'});
    } else {
      for (let i = 0; i < (s.nParcelas||1); i++) {
        const pr = Fmt.addMonths(s.primeiraParcela, i);
        if (pr === ref) rows.push({...s, parcelaNum:i+1, parcelaRef:pr, parcelaTotal:s.nParcelas, valorExib:s.valor, _parcelaIdx:i});
      }
    }
  });
  return rows;
}

function expandirEntradas(entradas, ref) {
  const rows = [];
  entradas.forEach(e => {
    if (e.forma === 'avista') {
      if (e.ref === ref) rows.push({...e, parcelaNum:null, parcelaRef:e.ref, parcelaTotal:1, valorExib:e.valor, _parcelaIdx:'av'});
    } else {
      for (let i = 0; i < (e.nParcelas||1); i++) {
        const pr = Fmt.addMonths(e.primeiraParcela, i);
        if (pr === ref) rows.push({...e, parcelaNum:i+1, parcelaRef:pr, parcelaTotal:e.nParcelas, valorExib:e.valor, _parcelaIdx:'av'});
      }
    }
  });
  return rows;
}

/* ════════════════════════════════════════════
   CÁLCULO DO RESUMO POR PESSOA
════════════════════════════════════════════ */
function calcularResumo(ref, pessoaFiltro) {
  const saidas   = expandirSaidas(cache.saidas || [], ref);
  const entradas = expandirEntradas(cache.entradas || [], ref);

  /* Coleta todos os tipos que parecem ser pessoas
     (exclui tipos genéricos como Cartão de Crédito, Boleto, etc.) */
  const tiposGenéricos = new Set(['Cartão de Crédito','Boleto','Financiamento','PIX',
    'Salário','Aluguel','Telefone','Casa','Diversas','Mercado','Luz','Água','Internet',
    'cartão de crédito','boleto','financiamento','pix','salário','aluguel']);

  const todasPessoas = new Set([
    ...saidas.map(r => r.tipo),
    ...entradas.map(r => r.tipo)
  ].filter(t => t && !tiposGenéricos.has(t)));

  const pessoas = pessoaFiltro
    ? [pessoaFiltro]
    : [...todasPessoas].sort();

  return pessoas.map(pessoa => {
    const saidasPessoa   = saidas.filter(r => r.tipo === pessoa);
    const entradasPessoa = entradas.filter(r => r.tipo === pessoa);

    const totalSaidas   = saidasPessoa.reduce((s, r) => s + r.valorExib, 0);
    const totalEntradas = entradasPessoa.reduce((s, r) => s + r.valorExib, 0);
    /* Saldo: positivo = pessoa me deve, negativo = eu devo a ela */
    const saldo = totalEntradas - totalSaidas;

    return { pessoa, saidasPessoa, entradasPessoa, totalSaidas, totalEntradas, saldo };
  }).filter(p => p.saidasPessoa.length > 0 || p.entradasPessoa.length > 0);
}

/* ════════════════════════════════════════════
   RENDER HTML
════════════════════════════════════════════ */
function renderResumo() {
  const ref        = document.getElementById('periodoInput').value;
  const pessoaSel  = document.getElementById('pessoaSelect').value;
  const content    = document.getElementById('content');

  if (!ref) { content.innerHTML = '<div class="empty">Selecione um período.</div>'; return; }

  const resumos = calcularResumo(ref, pessoaSel || null);

  if (!resumos.length) {
    content.innerHTML = `<div class="empty">Nenhum lançamento com pessoa identificada em ${Fmt.ref(ref)}.</div>`;
    return;
  }

  /* Cards de totais gerais */
  const totEntradas = resumos.reduce((s, r) => s + r.totalEntradas, 0);
  const totSaidas   = resumos.reduce((s, r) => s + r.totalSaidas, 0);
  const totSaldo    = totEntradas - totSaidas;
  const saldoClass  = totSaldo >= 0 ? 'saldo-pos' : 'saldo-neg';
  const saldoDesc   = totSaldo > 0
    ? 'No total, as pessoas me devem'
    : totSaldo < 0
    ? 'No total, eu devo às pessoas'
    : 'Estamos quites no total';

  let html = `
    <div class="periodo-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      ${Fmt.ref(ref)}
    </div>

    <div class="summary-cards">
      <div class="summary-card green">
        <div class="card-label">Elas me devem</div>
        <div class="card-value income">${Fmt.brl(totEntradas)}</div>
      </div>
      <div class="summary-card red">
        <div class="card-label">Eu devo a elas</div>
        <div class="card-value expense">${Fmt.brl(totSaidas)}</div>
      </div>
    </div>

    <div class="saldo-destaque">
      <div class="saldo-destaque-label">Saldo Geral</div>
      <div class="saldo-destaque-valor ${saldoClass}">${totSaldo >= 0 ? Fmt.brl(totSaldo) : '−' + Fmt.brl(Math.abs(totSaldo))}</div>
      <div class="saldo-destaque-sub">${saldoDesc}</div>
    </div>

    <div class="section-title">Detalhes por pessoa</div>
  `;

  resumos.forEach(({ pessoa, saidasPessoa, entradasPessoa, totalSaidas, totalEntradas, saldo }) => {
    const saldoClass = saldo > 0 ? 'pos' : saldo < 0 ? 'neg' : 'zero';
    const saldoDesc  = saldo > 0
      ? `${pessoa} me deve ${Fmt.brl(saldo)}`
      : saldo < 0
      ? `Eu devo ${Fmt.brl(Math.abs(saldo))} a ${pessoa}`
      : `Quites com ${pessoa}`;

    html += `<div class="pessoa-section">
      <div class="pessoa-header">
        <div class="pessoa-nome">${pessoa}</div>
        <div class="pessoa-saldo ${saldoClass}">${saldoDesc}</div>
      </div>`;

    /* Entradas — o que ela me pagou / deve me pagar */
    if (entradasPessoa.length) {
      html += `<div class="subtotal-row" style="background:rgba(0,201,122,.06);border-bottom:1px solid var(--border);border-top:none;">
        <span style="color:var(--income);">↑ Entradas (ela me paga)</span>
        <span style="color:var(--income);">${Fmt.brl(totalEntradas)}</span>
      </div>`;
      entradasPessoa.forEach(r => {
        const key  = r._parcelaIdx === 'av' ? 'av' : parseInt(r._parcelaIdx);
        const pago = (r.pagos||{})[key] || false;
        const parc = r.parcelaNum != null ? ` · ${r.parcelaNum}/${r.parcelaTotal}` : '';
        html += `<div class="item-row">
          <div class="item-left">
            <div class="item-desc">${r.descricao || '—'}</div>
            <div class="item-meta">${Fmt.ref(r.parcelaRef)}${parc}</div>
          </div>
          <div class="item-right">
            <div class="item-valor entrada">+${Fmt.brl(r.valorExib)}</div>
            <span class="badge-status ${pago?'pago':'pendente'}">${pago?'✔ Recebido':'● Pendente'}</span>
          </div>
        </div>`;
      });
    }

    /* Saídas — o que eu paguei / devo pagar por ela */
    if (saidasPessoa.length) {
      html += `<div class="subtotal-row" style="background:rgba(255,77,106,.06);border-top:1px solid var(--border);">
        <span style="color:var(--expense);">↓ Saídas (eu pago por ela)</span>
        <span style="color:var(--expense);">${Fmt.brl(totalSaidas)}</span>
      </div>`;
      saidasPessoa.forEach(r => {
        const key  = r._parcelaIdx === 'av' ? 'av' : parseInt(r._parcelaIdx);
        const pago = (r.pagos||{})[key] || false;
        const parc = r.parcelaNum != null ? ` · ${r.parcelaNum}/${r.parcelaTotal}` : '';
        html += `<div class="item-row">
          <div class="item-left">
            <div class="item-desc">${r.descricao || '—'}</div>
            <div class="item-meta">${Fmt.ref(r.parcelaRef)}${parc}</div>
          </div>
          <div class="item-right">
            <div class="item-valor saida">−${Fmt.brl(r.valorExib)}</div>
            <span class="badge-status ${pago?'pago':'pendente'}">${pago?'✔ Pago':'● Pendente'}</span>
          </div>
        </div>`;
      });
    }

    html += `</div>`; /* fecha pessoa-section */
  });

  content.innerHTML = html;
}

/* ════════════════════════════════════════════
   POPULA SELECT DE PESSOAS
════════════════════════════════════════════ */
function popularPessoas() {
  const ref = document.getElementById('periodoInput').value;
  const sel = document.getElementById('pessoaSelect');
  const tiposGenéricos = new Set(['Cartão de Crédito','Boleto','Financiamento','PIX',
    'Salário','Aluguel','Telefone','Casa','Diversas','Mercado','Luz','Água','Internet',
    'cartão de crédito','boleto','financiamento','pix','salário','aluguel']);

  const saidas   = expandirSaidas(cache.saidas || [], ref);
  const entradas = expandirEntradas(cache.entradas || [], ref);

  const pessoas = [...new Set([
    ...saidas.map(r => r.tipo),
    ...entradas.map(r => r.tipo)
  ].filter(t => t && !tiposGenéricos.has(t)))].sort();

  sel.innerHTML = '<option value="">Todas as pessoas</option>';
  pessoas.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
}

/* ════════════════════════════════════════════
   GERAR TEXTO PARA COMPARTILHAR
════════════════════════════════════════════ */
function gerarTexto() {
  const ref      = document.getElementById('periodoInput').value;
  const pessoaSel = document.getElementById('pessoaSelect').value;
  const resumos  = calcularResumo(ref, pessoaSel || null);

  if (!resumos.length) return '';

  const linhas = [`📊 *FinPanel — Resumo ${Fmt.ref(ref)}*\n`];

  resumos.forEach(({ pessoa, entradasPessoa, saidasPessoa, totalEntradas, totalSaidas, saldo }) => {
    linhas.push(`👤 *${pessoa}*`);

    if (entradasPessoa.length) {
      linhas.push(`  ↑ _Entradas (${pessoa} me paga)_ — ${Fmt.brl(totalEntradas)}`);
      entradasPessoa.forEach(r => {
        const key  = r._parcelaIdx === 'av' ? 'av' : parseInt(r._parcelaIdx);
        const pago = (r.pagos||{})[key];
        const parc = r.parcelaNum != null ? ` (${r.parcelaNum}/${r.parcelaTotal})` : '';
        const st   = pago ? '✔' : '●';
        linhas.push(`    ${st} ${r.descricao}${parc}: +${Fmt.brl(r.valorExib)}`);
      });
    }

    if (saidasPessoa.length) {
      linhas.push(`  ↓ _Saídas (eu pago por ${pessoa})_ — ${Fmt.brl(totalSaidas)}`);
      saidasPessoa.forEach(r => {
        const key  = r._parcelaIdx === 'av' ? 'av' : parseInt(r._parcelaIdx);
        const pago = (r.pagos||{})[key];
        const parc = r.parcelaNum != null ? ` (${r.parcelaNum}/${r.parcelaTotal})` : '';
        const st   = pago ? '✔' : '●';
        linhas.push(`    ${st} ${r.descricao}${parc}: −${Fmt.brl(r.valorExib)}`);
      });
    }

    const saldoTxt = saldo > 0
      ? `➡️ ${pessoa} me deve *${Fmt.brl(saldo)}*`
      : saldo < 0
      ? `➡️ Eu devo *${Fmt.brl(Math.abs(saldo))}* a ${pessoa}`
      : `➡️ Quites ✅`;
    linhas.push(`  ${saldoTxt}\n`);
  });

  return linhas.join('\n');
}

function compartilharWhatsApp() {
  const texto = gerarTexto();
  if (!texto) { alert('Nenhum dado para compartilhar.'); return; }
  const url = 'https://wa.me/?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}

function copiarTexto() {
  const texto = gerarTexto();
  if (!texto) { alert('Nenhum dado para compartilhar.'); return; }
  navigator.clipboard.writeText(texto).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✔ Copiado!';
    setTimeout(() => { btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copiar'; }, 2000);
  });
}

/* ════════════════════════════════════════════
   LÓGICA DE LOGIN — Usa o mesmo sistema do app
════════════════════════════════════════════ */
async function tentarLogin() {
  /* Verifica se há sessão salva no sessionStorage */
  const sess = sessionStorage.getItem('fp_session');
  if (sess) {
    try {
      const { userId } = JSON.parse(sess);
      await loadUserData(userId);
      return true;
    } catch {}
  }

  /* Sem sessão: tenta carregar usuários globais para fazer login */
  await loadGlobal();
  const usuarios = cache.usuarios || [];

  if (!usuarios.length) return false;

  /* Se só tem 1 usuário, carrega direto */
  if (usuarios.length === 1) {
    await loadUserData(usuarios[0].id);
    return true;
  }

  /* Múltiplos usuários: pede para escolher */
  return await mostrarSeletorUsuario(usuarios);
}

function mostrarSeletorUsuario(usuarios) {
  return new Promise(resolve => {
    document.getElementById('content').innerHTML = `
      <div style="padding:32px 0;text-align:center;">
        <div style="font-size:.9rem;color:var(--muted);margin-bottom:20px;">Selecione seu usuário para ver o resumo:</div>
        <div style="display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto;">
          ${usuarios.map(u => `
            <button onclick="window._selectUser(${u.id})" style="
              background:var(--surface);border:1px solid var(--border);color:var(--text);
              padding:14px 20px;border-radius:10px;font-family:var(--sans);font-size:.9rem;
              cursor:pointer;display:flex;align-items:center;gap:10px;
            ">
              <span style="width:32px;height:32px;border-radius:50%;background:var(--elevated);
                display:inline-flex;align-items:center;justify-content:center;
                font-weight:700;font-size:.8rem;color:var(--accent);">
                ${u.nome.slice(0,2).toUpperCase()}
              </span>
              ${u.nome}
            </button>`).join('')}
        </div>
      </div>`;

    window._selectUser = async (id) => {
      document.getElementById('content').innerHTML = '<div class="loading"><div class="spinner"></div>Carregando dados…</div>';
      await loadUserData(id);
      resolve(true);
    };
  });
}

/* ════════════════════════════════════════════
   INICIALIZAÇÃO
════════════════════════════════════════════ */
async function init() {
  /* Período padrão: mês atual */
  document.getElementById('periodoInput').value = Fmt.nowYM();

  try {
    await initFirebase();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="empty">❌ Erro ao conectar ao Firebase.<br>Verifique o arquivo firebase-config.js</div>';
    return;
  }

  document.getElementById('content').innerHTML =
    '<div class="loading"><div class="spinner"></div>Carregando dados…</div>';

  const ok = await tentarLogin();

  if (!ok) {
    document.getElementById('content').innerHTML =
      '<div class="empty">Nenhum dado encontrado.</div>';
    return;
  }

  popularPessoas();
  renderResumo();

  /* Atualiza ao mudar período ou pessoa */
  document.getElementById('periodoInput').addEventListener('change', () => {
    popularPessoas();
    renderResumo();
  });
  document.getElementById('pessoaSelect').addEventListener('change', renderResumo);
}

init();
</script>
